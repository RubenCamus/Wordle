<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="end.css" />
        <title>Pokémon Wordle</title>
    </head>
    <body>
        <div id="popup" class="end-screen-wrapper">
            <div class="title-wrapper">
                <h2>Pokemon Wordle</h2>
            </div>
            <div class="responses-wrapper">
                <!-- LOOK AT LOCALSTORAGE ATTEMPTS AND LOAD ONE ROW OF EMOJIS BASED -->
                <span></span>
            </div>
            <p class="frase-palabra">
                La palabra es:
                <span id="palabra-revelada">FETCHPALABRA</span>
            </p>
            <div class="content-wrapper">
                <div class="timer-wrapper">
                    <span>Siguiente palabra en:</span>
                    <span id="timer-text"
                        >(Tiempo actual hasta 00:00 GMT+1)</span
                    >
                </div>
                <div class="socials-wrapper">
                    <span>Share your result</span>
                    <div class="socials-icons-wrapper">
                        <a href=""
                            ><img
                                class="social-icon"
                                src="public/twitter-black.svg"
                                alt="Icono Twitter"
                        /></a>
                        <a href=""
                            ><img
                                class="social-icon"
                                src="public/bluesky.svg"
                                alt="Icono Bluesky"
                        /></a>
                        <a href=""
                            ><img
                                class="social-icon"
                                src="public/share.png"
                                alt="Icono Copiar"
                        /></a>
                    </div>
                </div>
            </div>

                <h2>Check out my other projects</h2>
                <div class="project">

                    <div class="project-text">
                        <h3>Project Title</h3>

                    </div>
                </div>
            </div>-->
            <div id="my-socials">
                Wordle game by Ruben C
                <a href="https://github.com/RubenCamus"
                    ><img
                        class="social-icon"
                        src="public/Github_Icon.png"
                        alt="Github Icon"
                /></a>
            </div>
        </div>
        <button onclick="toggleEndScreen()">HOla</button>
    </body>
    <footer></footer>
    <script src="index.js"></script>
